name: CI

on:
  pull_request:
    paths-ignore:
      - '*.md'
      - '**/*.md'
      - 'docs/**'
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '*.md'
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: actions/gha-workflows/.gitea/workflows/ci-python-unified.yml@main
    with:
      package-manager: uv
      python-version: '3.14'
      docker-enabled: true
      sonarqube: true
      security-scan: true
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
